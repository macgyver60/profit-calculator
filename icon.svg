<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="180" height="180" rx="40" fill="url(#grad)"/>
  
  <!-- Calculator icon design -->
  <g transform="translate(45, 45)">
    <!-- Display screen -->
    <rect x="0" y="0" width="90" height="35" rx="4" fill="rgba(255, 255, 255, 0.2)" stroke="white" stroke-width="2"/>
    
    <!-- Display text (result) -->
    <text x="85" y="24" font-size="16" font-weight="bold" fill="white" text-anchor="end" font-family="Arial, sans-serif">-240K</text>
    
    <!-- Button grid -->
    <!-- Row 1 -->
    <rect x="0" y="45" width="18" height="18" rx="3" fill="white" opacity="0.8"/>
    <rect x="22" y="45" width="18" height="18" rx="3" fill="white" opacity="0.8"/>
    <rect x="44" y="45" width="18" height="18" rx="3" fill="white" opacity="0.6"/>
    <rect x="66" y="45" width="18" height="18" rx="3" fill="white" opacity="0.6"/>
    
    <!-- Row 2 -->
    <rect x="0" y="67" width="18" height="18" rx="3" fill="white" opacity="0.8"/>
    <rect x="22" y="67" width="18" height="18" rx="3" fill="white" opacity="0.8"/>
    <rect x="44" y="67" width="18" height="18" rx="3" fill="white" opacity="0.6"/>
    <rect x="66" y="67" width="18" height="18" rx="3" fill="white" opacity="0.6"/>
  </g>
</svg>