<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProCalc</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .phone-frame {
            width: 100%;
            max-width: 375px;
            background: white;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 12px solid #000;
            position: relative;
        }
        .phone-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 28px;
            background: #000;
            border-radius: 0 0 25px 25px;
            z-index: 10;
        }
        .app-container {
            padding-top: 10px;
            height: 100vh;
            overflow-y: auto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .status-bar {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            color: white;
            font-size: 13px;
            font-weight: 600;
        }
        .header {
            padding: 20px 15px;
            text-align: center;
        }
        .app-title {
            color: white;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .app-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
        }
        .content {
            background: white;
            margin: 10px;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 15px 0 10px 0;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-label {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }
        .input-label-value {
            color: #667eea;
            font-weight: 600;
        }
        .input-with-toggle {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        input[type="number"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #e5e5e7;
            border-radius: 8px;
            font-size: 16px;
            background: #f5f5f7;
        }
        input[type="number"]:focus {
            outline: none;
            background: white;
            border-color: #667eea;
        }
        .toggle-button {
            padding: 8px 12px;
            background: #f5f5f7;
            border: 1px solid #e5e5e7;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-button:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .toggle-button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .slider-group {
            margin-bottom: 15px;
        }
        .slider-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="range"] {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: #e5e5e7;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }
        input[type="range"]::-moz-range-thumb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }
        .percentage-input {
            width: 70px;
            padding: 8px;
            border: 1px solid #e5e5e7;
            border-radius: 6px;
            font-size: 14px;
            background: #f5f5f7;
            text-align: center;
            font-weight: 600;
            color: #667eea;
        }
        .percentage-input:focus {
            outline: none;
            background: white;
            border-color: #667eea;
        }
        .result-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            color: white;
            margin: 15px 0;
        }
        .result-card.loss {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
        }
        .result-label {
            font-size: 13px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .result-value {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .breakdown {
            background: rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            backdrop-filter: blur(10px);
        }
        .breakdown-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
        }
        .home-indicator {
            height: 20px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 5px;
        }
        .home-line {
            width: 120px;
            height: 4px;
            background: #000;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="app-container">
            <div class="status-bar">
                <span>9:41</span>
                <div style="display: flex; gap: 5px;">
                    <span>📶</span>
                    <span>📡</span>
                    <span>🔋</span>
                </div>
            </div>

            <div class="header">
                <div class="app-title">ProCalc</div>
                <div class="app-subtitle">Profit Calculator</div>
            </div>

            <div class="content">
                <div class="section-title">Inputs</div>
                
                <div class="input-group">
                    <div class="input-label">
                        <span>Overhead</span>
                        <span class="input-label-value" id="overheadDisplay">$3M</span>
                    </div>
                    <input type="number" id="overhead" value="3000000" placeholder="Enter overhead">
                </div>

                <div class="input-group">
                    <div class="input-label">
                        <span>Revenue</span>
                        <span class="input-label-value" id="revenueDisplay">$4M</span>
                    </div>
                    <div class="input-with-toggle">
                        <input type="number" id="revenue" value="4000000" placeholder="Enter revenue">
                        <button class="toggle-button active" id="annualBtn" onclick="togglePeriod('annual')">Annual</button>
                        <button class="toggle-button" id="monthlyBtn" onclick="togglePeriod('monthly')">Monthly</button>
                    </div>
                </div>

                <div class="section-title" style="margin-top: 20px;">Your Share</div>

                <div class="slider-group">
                    <div class="input-label">
                        <span>Overhead Share %</span>
                    </div>
                    <div class="slider-container">
                        <input type="range" id="overheadSlider" min="0" max="100" value="14" step="0.1">
                        <input type="number" id="overheadInput" class="percentage-input" value="14" min="0" max="100" step="0.1">
                    </div>
                </div>

                <div class="slider-group">
                    <div class="input-label">
                        <span>Revenue Share %</span>
                    </div>
                    <div class="slider-container">
                        <input type="range" id="revenueSlider" min="0" max="100" value="4.5" step="0.1">
                        <input type="number" id="revenueInput" class="percentage-input" value="4.5" min="0" max="100" step="0.1">
                    </div>
                </div>

                <div class="result-card" id="resultCard">
                    <div class="result-label">Your Net Profit</div>
                    <div class="result-value" id="result">-$240K</div>
                    <div class="breakdown">
                        <div class="breakdown-row">
                            <span>Your Revenue:</span>
                            <span id="yourRevenue">$180K</span>
                        </div>
                        <div class="breakdown-row">
                            <span>Your Overhead:</span>
                            <span id="yourOverhead">$420K</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="home-indicator">
                <div class="home-line"></div>
            </div>
        </div>
    </div>

    <script>
        const overheadInput = document.getElementById('overhead');
        const revenueInput = document.getElementById('revenue');
        const overheadSlider = document.getElementById('overheadSlider');
        const revenueSlider = document.getElementById('revenueSlider');
        const overheadPercentageInput = document.getElementById('overheadInput');
        const revenuePercentageInput = document.getElementById('revenueInput');
        const resultCard = document.getElementById('resultCard');
        const annualBtn = document.getElementById('annualBtn');
        const monthlyBtn = document.getElementById('monthlyBtn');
        
        let periodType = 'annual'; // Track current period

        function formatCurrency(value) {
            if (value >= 1000000) {
                return '$' + (value / 1000000).toFixed(1) + 'M';
            } else if (value >= 1000) {
                return '$' + (value / 1000).toFixed(0) + 'K';
            }
            return '$' + value.toFixed(0);
        }

        function togglePeriod(period) {
            periodType = period;
            
            if (period === 'annual') {
                annualBtn.classList.add('active');
                monthlyBtn.classList.remove('active');
            } else {
                annualBtn.classList.remove('active');
                monthlyBtn.classList.add('active');
            }
            
            calculate();
        }

        function calculate() {
            let overhead = parseFloat(overheadInput.value) || 0;
            let revenue = parseFloat(revenueInput.value) || 0;
            
            // If monthly period, multiply ONLY revenue by 12 for annual calculations
            if (periodType === 'monthly') {
                revenue = revenue * 12;
            }
            
            const overheadShare = parseFloat(overheadSlider.value) || 0;
            const revenueShare = parseFloat(revenueSlider.value) || 0;
            
            // Your share of revenue
            const yourRevenue = revenue * (revenueShare / 100);
            
            // Your share of overhead (cost)
            const yourOverhead = overhead * (overheadShare / 100);
            
            // Your net profit = your revenue - your overhead
            const yourNetProfit = yourRevenue - yourOverhead;
            
            document.getElementById('result').textContent = formatCurrency(yourNetProfit);
            document.getElementById('yourRevenue').textContent = formatCurrency(yourRevenue);
            document.getElementById('yourOverhead').textContent = formatCurrency(yourOverhead);
            
            document.getElementById('overheadDisplay').textContent = formatCurrency(overhead);
            document.getElementById('revenueDisplay').textContent = formatCurrency(revenue);
            
            // Change card color if loss
            if (yourNetProfit < 0) {
                resultCard.classList.add('loss');
            } else {
                resultCard.classList.remove('loss');
            }
        }

        // Overhead Share - sync slider and input
        overheadSlider.addEventListener('input', (e) => {
            overheadPercentageInput.value = e.target.value;
            calculate();
        });

        overheadPercentageInput.addEventListener('input', (e) => {
            let value = parseFloat(e.target.value) || 0;
            if (value > 100) value = 100;
            if (value < 0) value = 0;
            overheadSlider.value = value;
            calculate();
        });

        // Revenue Share - sync slider and input
        revenueSlider.addEventListener('input', (e) => {
            revenuePercentageInput.value = e.target.value;
            calculate();
        });

        revenuePercentageInput.addEventListener('input', (e) => {
            let value = parseFloat(e.target.value) || 0;
            if (value > 100) value = 100;
            if (value < 0) value = 0;
            revenueSlider.value = value;
            calculate();
        });

        // Amount inputs
        overheadInput.addEventListener('input', calculate);
        revenueInput.addEventListener('input', calculate);

        calculate();
    </script>
</body>
</html>
