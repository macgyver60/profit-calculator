<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProCalc</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .phone-frame {
            width: 100%;
            max-width: 375px;
            background: white;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 12px solid #000;
            position: relative;
        }
        .phone-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 28px;
            background: #000;
            border-radius: 0 0 25px 25px;
            z-index: 10;
        }
        .app-container {
            padding-top: 10px;
            height: 100vh;
            overflow-y: auto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .status-bar {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            color: white;
            font-size: 13px;
            font-weight: 600;
        }
        .header {
            padding: 20px 15px;
            text-align: center;
        }
        .app-title {
            color: white;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .app-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
        }
        .content {
            background: white;
            margin: 10px;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 15px 0 10px 0;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-label {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }
        .input-label-value {
            color: #667eea;
            font-weight: 600;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #e5e5e7;
            border-radius: 8px;
            font-size: 16px;
            background: #f5f5f7;
        }
        input[type="number"]:focus {
            outline: none;
            background: white;
            border-color: #667eea;
        }
        .slider-group {
            margin-bottom: 15px;
        }
        input[type="range"] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #e5e5e7;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }
        input[type="range"]::-moz-range-thumb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }
        .result-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            color: white;
            margin: 15px 0;
        }
        .result-label {
            font-size: 13px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .result-value {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .breakdown {
            background: rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            backdrop-filter: blur(10px);
        }
        .breakdown-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
        }
        .home-indicator {
            height: 20px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 5px;
        }
        .home-line {
            width: 120px;
            height: 4px;
            background: #000;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="app-container">
            <div class="status-bar">
                <span>9:41</span>
                <div style="display: flex; gap: 5px;">
                    <span>📶</span>
                    <span>📡</span>
                    <span>🔋</span>
                </div>
            </div>

            <div class="header">
                <div class="app-title">ProCalc</div>
                <div class="app-subtitle">Profit Calculator</div>
            </div>

            <div class="content">
                <div class="section-title">Inputs</div>
                
                <div class="input-group">
                    <div class="input-label">
                        <span>Overhead</span>
                        <span class="input-label-value" id="overheadDisplay">$3M</span>
                    </div>
                    <input type="number" id="overhead" value="3000000" placeholder="Enter overhead">
                </div>

                <div class="input-group">
                    <div class="input-label">
                        <span>Revenue</span>
                        <span class="input-label-value" id="revenueDisplay">$4M</span>
                    </div>
                    <input type="number" id="revenue" value="4000000" placeholder="Enter revenue">
                </div>

                <div class="section-title" style="margin-top: 20px;">Your Share</div>

                <div class="slider-group">
                    <div class="input-label">
                        <span>Overhead Share</span>
                        <span class="input-label-value" id="overheadShareDisplay">14%</span>
                    </div>
                    <input type="range" id="overheadSlider" min="0" max="100" value="14" step="0.1">
                </div>

                <div class="slider-group">
                    <div class="input-label">
                        <span>Profit Share</span>
                        <span class="input-label-value" id="revenueShareDisplay">8%</span>
                    </div>
                    <input type="range" id="revenueSlider" min="0" max="100" value="8" step="0.1">
                </div>

                <div class="result-card">
                    <div class="result-label">Your Total Share</div>
                    <div class="result-value" id="result">$428K</div>
                    <div class="breakdown">
                        <div class="breakdown-row">
                            <span>From Overhead:</span>
                            <span id="overheadProfit">$420K</span>
                        </div>
                        <div class="breakdown-row">
                            <span>From Profit:</span>
                            <span id="profitProfit">$8K</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="home-indicator">
                <div class="home-line"></div>
            </div>
        </div>
    </div>

    <script>
        const overheadInput = document.getElementById('overhead');
        const revenueInput = document.getElementById('revenue');
        const overheadSlider = document.getElementById('overheadSlider');
        const revenueSlider = document.getElementById('revenueSlider');

        function formatCurrency(value) {
            if (value >= 1000000) {
                return '$' + (value / 1000000).toFixed(1) + 'M';
            } else if (value >= 1000) {
                return '$' + (value / 1000).toFixed(0) + 'K';
            }
            return '$' + value.toFixed(0);
        }

        function calculate() {
            const overhead = parseFloat(overheadInput.value) || 0;
            const revenue = parseFloat(revenueInput.value) || 0;
            const overheadShare = parseFloat(overheadSlider.value) || 0;
            const revenueShare = parseFloat(revenueSlider.value) || 0;
            
            const profit = revenue - overhead;
            const overheadProfit = overhead * (overheadShare / 100);
            const profitContribution = profit * (revenueShare / 100);
            const totalProfit = overheadProfit + profitContribution;
            
            document.getElementById('result').textContent = formatCurrency(totalProfit);
            document.getElementById('overheadProfit').textContent = formatCurrency(overheadProfit);
            document.getElementById('profitProfit').textContent = formatCurrency(profitContribution);
            
            document.getElementById('overheadDisplay').textContent = formatCurrency(overhead);
            document.getElementById('revenueDisplay').textContent = formatCurrency(revenue);
            document.getElementById('overheadShareDisplay').textContent = overheadSlider.value + '%';
            document.getElementById('revenueShareDisplay').textContent = revenueSlider.value + '%';
        }

        overheadInput.addEventListener('input', calculate);
        revenueInput.addEventListener('input', calculate);
        overheadSlider.addEventListener('input', calculate);
        revenueSlider.addEventListener('input', calculate);

        calculate();
    </script>
</body>
</html>
